{% extends 'dashboard.html' %}
{% load static tailwind_tags %}

{% block dashboard_content %}
<div class="flex h-full w-full p-6">
  <!-- Rounded card that fits whole div -->
  <div class="relative flex-row rounded-lg bg-white shadow-lg p-4 h-full w-full overflow-auto">

    <!-- Title that lies in the card -->
    <h1 class="text-2xl font-poppins text-gray-800">Live Video Feed</h1>
      
    <hr class="my-4 h-0.5 border-t-1 bg-neutral-100 dark:bg-white/10" />

    <!-- Tab Navigation -->
    <div class="mb-6">
      <ul class="flex border-b border-gray-200">
        <li class="mr-2">
          <button id="oldCameraTab" class="inline-block p-4 rounded-t-lg border-b-2 border-transparent hover:text-gray-600 hover:border-gray-300">
            Old Camera System
          </button>
        </li>
        <li class="mr-2">
          <button id="golfCameraTab" class="inline-block p-4 rounded-t-lg border-b-2 border-blue-500 text-blue-500">
            Golf Camera (New)
          </button>
        </li>
      </ul>
    </div>

    <!-- Old Camera Tab Content -->
    <div id="oldCameraContent" class="hidden">
      <div class="flex flex-col gap-2 md:flex-row md:gap-4 mb-6">
        <button class="bg-indigo-500 hover:bg-indigo-400 py-2 px-4 rounded-lg text-white w-full md:h-auto" id="live-button">
          <p class="whitespace-nowrap text-white font-poppins">Start Video Feed</p> 
        </button>
    
        <button class="bg-indigo-500 hover:bg-indigo-400 py-2 px-4 rounded-lg text-white w-full md:h-auto" id="start-recording-button">
          <p class="whitespace-nowrap text-white font-poppins">Start Recording</p> 
        </button>
      </div>

      <div class="w-full py-2 overflow-hidden">
        <img 
          id="video-feed" 
          class="w-full h-100 bg-gray-200 flex items-center justify-center" 
          src="" 
          alt="Live View Feed"
          onerror="this.style.display='none'; document.getElementById('error-placeholder').style.display='flex';"
        />
        <!-- Placeholder for Error -->
        <div 
          id="error-placeholder" 
          class="hidden w-full h-64 bg-gray-100 text-center text-gray-500 flex items-center justify-center">
            Live view feed is not available. Please check the connection.
        </div>
      </div>
    </div>

    <!-- Golf Camera Tab Content -->
    <div id="golfCameraContent">
      {% include 'golf_camera_component.html' %}
    </div>

  </div>
</div>

<script>
// Tab switching functionality
document.addEventListener('DOMContentLoaded', function() {
  const oldTab = document.getElementById('oldCameraTab');
  const golfTab = document.getElementById('golfCameraTab');
  const oldContent = document.getElementById('oldCameraContent');
  const golfContent = document.getElementById('golfCameraContent');

  function switchToOldCamera() {
    // Update tabs
    oldTab.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
    oldTab.classList.add('border-blue-500', 'text-blue-500');
    golfTab.classList.remove('border-blue-500', 'text-blue-500');
    golfTab.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');

    // Update content
    oldContent.classList.remove('hidden');
    golfContent.classList.add('hidden');
  }

  function switchToGolfCamera() {
    // Update tabs
    golfTab.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
    golfTab.classList.add('border-blue-500', 'text-blue-500');
    oldTab.classList.remove('border-blue-500', 'text-blue-500');
    oldTab.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');

    // Update content
    golfContent.classList.remove('hidden');
    oldContent.classList.add('hidden');
  }

  oldTab.addEventListener('click', switchToOldCamera);
  golfTab.addEventListener('click', switchToGolfCamera);

  // Old camera functionality (your existing code)
  document.getElementById('live-button').addEventListener('click', function() {
    const videoFeed = document.getElementById('video-feed');
    const liveStreamURL = '/home/live_stream/';

    videoFeed.src = liveStreamURL;
    document.getElementById('error-placeholder').style.display = 'none';
    videoFeed.style.display = 'block';
  });

  document.getElementById('start-recording-button').addEventListener('click', function() {
    fetch('/home/start_recording/', { method: 'POST' })
      .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => alert(data.message))
        .catch(error => alert("Error starting recording: " + error.message));
    });
});
</script>

{% endblock dashboard_content %}
